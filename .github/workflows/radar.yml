name: Radar bandi PA

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      giorni:
        description: "Finestra di pubblicazione a ritroso (giorni)"
        default: "10"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test offline
        run: python tests/test_radar.py > /dev/null

      - name: Interroga ANAC
        run: python radar/radar.py --giorni "${{ github.event.inputs.giorni || '10' }}"

      - name: Salva i risultati
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Radar $(date -u +%Y-%m-%d)"
          git push
